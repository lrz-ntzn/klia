<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1419" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f7fb" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Kian Korean: Hangul flash cards, sentence order drills, vocab, and pronunciation for English speakers." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Kian Korean</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <h1 id="title">Kian Korean</h1>
        <div class="sub">EN → KO</div>
      </div>
      <button class="icon-btn" id="about-link" title="About" aria-label="About">ℹ️</button>
    </header>

    <main>
      <section class="view active" data-view="home"></section>
      <section class="view" data-view="hangul"></section>
      <section class="view" data-view="sounds"></section>
      <section class="view" data-view="syntax"></section>
      <section class="view" data-view="vocab"></section>
      <section class="view" data-view="progress"></section>
      <section class="view" data-view="about"></section>
    </main>

    <nav class="nav" aria-label="Primary">
      <button data-nav="home" class="active"><span class="ico">🏠</span>Home</button>
      <button data-nav="hangul"><span class="ico">ㄱ</span>Hangul</button>
      <button data-nav="sounds"><span class="ico">ㅏ</span>Sounds</button>
      <button data-nav="syntax"><span class="ico">⇅</span>Order</button>
      <button data-nav="vocab"><span class="ico">語</span>Vocab</button>
      <button data-nav="progress"><span class="ico">📈</span>Stats</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
