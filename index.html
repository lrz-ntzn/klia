<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1230" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#fff6e8" media="(prefers-color-scheme: light)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Kian Korean: flash cards for the words and endings that build a Korean sentence." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <link rel="stylesheet" href="css/app.css" />
  <title>Kian Korean</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <h1 id="title">Kian Korean</h1>
        <div class="sub">EN → KO</div>
      </div>
      <div class="top-stats">
        <span class="stat-pill" id="streak-pill" title="Day streak">0</span>
        <span class="stat-pill xp" id="xp-pill" title="XP today">0 XP</span>
        <button class="icon-btn" id="mute-btn" type="button" aria-label="Mute sounds" aria-pressed="false">Sound</button>
        <button class="icon-btn" id="about-link" type="button" title="About" aria-label="About">i</button>
      </div>
    </header>

    <main>
      <section class="view active" data-view="home"></section>
      <section class="view" data-view="study"></section>
      <section class="view" data-view="practice"></section>
      <section class="view" data-view="hangul"></section>
      <section class="view" data-view="sounds"></section>
      <section class="view" data-view="syntax"></section>
      <section class="view" data-view="vocab"></section>
      <section class="view" data-view="progress"></section>
      <section class="view" data-view="about"></section>
    </main>

    <nav class="nav" aria-label="Primary">
      <button data-nav="home" class="active"><span class="ico">☰</span>Decks</button>
      <button data-nav="syntax"><span class="ico">⇅</span>Build</button>
      <button data-nav="practice"><span class="ico">＋</span>More</button>
      <button data-nav="progress"><span class="ico">📈</span>Stats</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
